<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ASTC Adaptive Navigation</title>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; height: 100vh; overflow: hidden; }

    /* PAGE 1: SETUP LANDING SCREEN */
    #setup-page {
      display: flex; justify-content: center; align-items: center; height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); padding: 20px;
    }
    .setup-card {
      width: 100%; max-width: 440px; background: #1e293b; border: 1px solid #334155;
      border-radius: 16px; padding: 24px; display: flex; flex-direction: column; gap: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: #38bdf8; }
    .brand span { background: #0284c7; color: white; padding: 3px 8px; border-radius: 6px; font-size: 11px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #94a3b8; }
    select, input {
      width: 100%; background: #0f172a; border: 1px solid #475569; color: white;
      padding: 12px; border-radius: 8px; font-size: 14px; outline: none;
    }
    select:focus, input:focus { border-color: #38bdf8; }

    .btn-start {
      background: #0284c7; color: white; border: none; padding: 14px; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.2s;
    }
    .btn-start:hover { background: #0369a1; }

    /* PAGE 2: MAP & LIVE NAVIGATION VIEW */
    #nav-page { display: none; height: 100vh; flex-direction: column; position: relative; }
    #map { flex: 1; width: 100%; }

    /* CONGESTION MODES TOOLBAR (TOP-LEFT) */
    .demo-bar {
      position: absolute; top: 16px; left: 16px; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px); border: 1px solid #334155; border-radius: 12px;
      padding: 10px 14px; z-index: 30; display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .demo-title { font-size: 10px; font-weight: 800; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.5px; }
    .demo-btn-group { display: flex; gap: 6px; }
    .btn-demo {
      background: #334155; color: #f8fafc; border: 1px solid #475569; padding: 6px 10px;
      border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; transition: all 0.2s;
    }
    .btn-demo:hover { background: #0284c7; border-color: #38bdf8; }
    .btn-demo.active { background: #0284c7; border-color: #38bdf8; color: white; }

    /* Top Right Floating HUD (Distance & Dynamic Optimal ETA) */
    .hud-top-right {
      position: absolute; top: 16px; right: 16px; background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(8px); border: 1px solid #334155; border-radius: 12px;
      padding: 12px 18px; z-index: 20; display: flex; gap: 20px; align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .hud-metric { display: flex; flex-direction: column; }
    .hud-label { font-size: 10px; text-transform: uppercase; font-weight: 700; color: #94a3b8; }
    .hud-val { font-size: 18px; font-weight: 800; color: #38bdf8; }

    /* Bottom Control Bar */
    .bottom-bar {
      height: 220px; background: #1e293b; border-top: 1px solid #334155;
      display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px; z-index: 20;
    }
    .panel-left { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
    .panel-right { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; }

    /* Signal Traffic Lights */
    .signal-box { display: flex; align-items: center; gap: 10px; }
    .light-circle { width: 18px; height: 18px; border-radius: 50%; opacity: 0.2; transition: opacity 0.3s; }
    .light-red { background: #ef4444; box-shadow: 0 0 10px #ef4444; }
    .light-yellow { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; }
    .light-green { background: #10b981; box-shadow: 0 0 10px #10b981; }
    .active-light { opacity: 1.0; }

    .timer-text { font-size: 18px; font-weight: 800; }

    .btn-drive {
      background: #10b981; color: white; border: none; padding: 16px; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s;
    }
    .btn-drive:hover { background: #059669; }

    .census-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; font-size: 11px; color: #94a3b8; }
    .census-grid b { color: white; }

    /* Modal Arrival Summary Report */
    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 100; justify-content: center; align-items: center; padding: 20px;
    }
    .modal-content {
      background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 24px;
      max-width: 420px; width: 100%; display: flex; flex-direction: column; gap: 14px;
    }
  </style>
</head>
<body>

  <!-- PAGE 1: SETUP FORM -->
  <div id="setup-page">
    <div class="setup-card">
      <div class="brand">🚦 ASTC <span>ADAPTIVE AI</span></div>
      
      <div class="form-group">
        <label>1. Select Vehicle Type</label>
        <select id="user-vehicle">
          <option value="car" data-speed="35">🚗 Car / Taxi (1.0 PCU)</option>
          <option value="motorcycle" data-speed="40">🏍️ Motorcycle / Scooter (0.5 PCU)</option>
          <option value="autorickshaw" data-speed="28">🛺 Auto-Rickshaw (1.0 PCU)</option>
          <option value="bus" data-speed="25">🚌 Bus / Heavy Vehicle (2.2 PCU)</option>
        </select>
      </div>

      <div class="form-group">
        <label>2. Source Location</label>
        <input type="text" id="origin-input" value="Chennai Central">
      </div>

      <div class="form-group">
        <label>3. Destination</label>
        <input type="text" id="dest-input" value="T. Nagar">
      </div>

      <button class="btn-start" onclick="initiateNavigation()">🧭 Start Navigation</button>
    </div>
  </div>

  <!-- PAGE 2: MAP & LIVE CONTROLS -->
  <div id="nav-page">
    <!-- CONGESTION MODES TOOLBAR -->
    <div class="demo-bar">
      <div class="demo-title">⚡ Congestion Modes</div>
      <div class="demo-btn-group">
        <button class="btn-demo" id="btn-light" onclick="triggerMode(0)">🟢 Light (15s)</button>
        <button class="btn-demo active" id="btn-moderate" onclick="triggerMode(1)">🟡 Moderate (30s)</button>
        <button class="btn-demo" id="btn-heavy" onclick="triggerMode(2)">🔴 Heavy (45s)</button>
        <button class="btn-demo" id="btn-emergency" onclick="triggerMode(3)">🚨 Emergency (60s)</button>
      </div>
    </div>

    <!-- Top Right Floating HUD (Distance & ETA) -->
    <div class="hud-top-right">
      <div class="hud-metric">
        <div class="hud-label">Distance</div>
        <div class="hud-val" id="hud-distance">-- km</div>
      </div>
      <div style="width: 1px; height: 28px; background: #334155;"></div>
      <div class="hud-metric">
        <div class="hud-label">Optimal ETA</div>
        <div class="hud-val" id="hud-eta">-- mins</div>
      </div>
    </div>

    <!-- Map Container -->
    <div id="map"></div>

    <!-- Bottom Dashboard Bar -->
    <div class="bottom-bar">
      <!-- Left Box: Red/Yellow/Green Signal Telemetry & PCU Census -->
      <div class="panel-left">
        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Intersection AI Telemetry</div>
        
        <div class="signal-box">
          <div class="light-circle light-red" id="light-red"></div>
          <div class="light-circle light-yellow" id="light-yellow"></div>
          <div class="light-circle light-green" id="light-green"></div>
          <div class="timer-text" id="signal-status">30s GREEN</div>
        </div>

        <div style="font-size: 12px; color: #cbd5e1;" id="route-status">Initializing AI adaptive phase...</div>

        <div class="census-grid">
          <div>🏍️ 2W: <b id="cnt-2w">0</b></div>
          <div>🚗 4W: <b id="cnt-4w">0</b></div>
          <div>🛺 Auto: <b id="cnt-auto">0</b></div>
          <div>🚌 Heavy: <b id="cnt-heavy">0</b></div>
        </div>
      </div>

      <!-- Right Box: Drive to Next Signal Action Button -->
      <div class="panel-right">
        <div style="font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase;">Route Progress</div>
        <div style="font-size: 12px; color: #94a3b8;" id="step-info">Press Drive to Move</div>
        <button class="btn-drive" onclick="moveToNextSignal()">🚘 Drive to Next Signal</button>
      </div>
    </div>
  </div>

  <!-- Arrival Report Modal -->
  <div class="modal" id="arrival-modal">
    <div class="modal-content">
      <h2 style="color: #10b981; font-size: 20px;">🏁 Destination Reached!</h2>
      <div style="font-size: 14px; color: #cbd5e1;" id="report-text"></div>
      <button class="btn-start" onclick="location.reload()">🔄 Start New Journey</button>
    </div>
  </div>

  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <script>
    const BACKEND_URL = "/api/telemetry"; 

    const knownCoords = {
      "chennai central": [80.2707, 13.0827],
      "egmore": [80.2600, 13.0780],
      "t. nagar": [80.2340, 13.0418],
      "anna nagar": [80.2121, 13.0850],
      "guindy": [80.2087, 13.0067],
      "marina beach": [80.2825, 13.0500]
    };

    let map, vehicleMarker, routeCoords = [];
    let currentStep = 0;
    let journeyStartTime, totalDistanceKm = 0, predictedEtaMins = 0;

    // Traffic modes matching exact system specs
    const trafficProfiles = [
      { id: "light", mode: "LIGHT", greenSecs: 15, text: "🟢 LIGHT TRAFFIC: 15s Green (PCU ≤ 7)", counts: { motorcycle: 4, car: 3, autorickshaw: 1, bus: 0 } },
      { id: "moderate", mode: "MODERATE", greenSecs: 30, text: "🟡 MODERATE TRAFFIC: 30s Green (PCU 8-15)", counts: { motorcycle: 8, car: 7, autorickshaw: 3, bus: 1 } },
      { id: "heavy", mode: "HEAVY", greenSecs: 45, text: "🔴 HEAVY CONGESTION: 45s Green (PCU > 15)", counts: { motorcycle: 18, car: 14, autorickshaw: 6, bus: 4 } },
      { id: "emergency", mode: "EMERGENCY", greenSecs: 60, text: "🚨 EMERGENCY CLEARANCE: 60s Priority Override", counts: { motorcycle: 1, car: 1, autorickshaw: 0, bus: 0 } }
    ];

    let currentProfileIdx = 1; // Default to Moderate
    let simTimer = trafficProfiles[1].greenSecs;
    let simPhase = "GREEN";

    async function initiateNavigation() {
      const originStr = document.getElementById('origin-input').value.trim().toLowerCase();
      const destStr = document.getElementById('dest-input').value.trim().toLowerCase();
      
      const start = knownCoords[originStr] || [80.2707, 13.0827];
      const end = knownCoords[destStr] || [80.2340, 13.0418];

      // Switch screens
      document.getElementById('setup-page').style.display = 'none';
      document.getElementById('nav-page').style.display = 'flex';

      // Initialize Map
      map = new maplibregl.Map({
        container: 'map',
        style: 'https://demotiles.maplibre.org/style.json',
        center: start,
        zoom: 13
      });

      map.on('load', async () => {
        const osrmUrl = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${end[0]},${end[1]}?overview=full&geometries=geojson`;
        
        try {
          const res = await fetch(osrmUrl);
          const data = await res.json();
          routeCoords = data.routes[0].geometry.coordinates;
          
          totalDistanceKm = (data.routes[0].distance / 1000).toFixed(1);
          
          const selectElem = document.getElementById('user-vehicle');
          const avgSpeed = parseFloat(selectElem.options[selectElem.selectedIndex].dataset.speed);
          predictedEtaMins = Math.round((totalDistanceKm / avgSpeed) * 60 + 3);

          document.getElementById('hud-distance').innerText = `${totalDistanceKm} km`;
          document.getElementById('hud-eta').innerText = `${predictedEtaMins} mins`;

          map.addSource('route', {
            'type': 'geojson',
            'data': { 'type': 'Feature', 'geometry': { 'type': 'LineString', 'coordinates': routeCoords } }
          });

          map.addLayer({
            'id': 'route-line',
            'type': 'line',
            'source': 'route',
            'paint': { 'line-color': '#0284c7', 'line-width': 6 }
          });

          new maplibregl.Marker({ color: '#10b981' }).setLngLat(start).addTo(map);
          new maplibregl.Marker({ color: '#ef4444' }).setLngLat(end).addTo(map);

          const vEl = document.createElement('div');
          vEl.innerHTML = '🚘'; vEl.style.fontSize = '24px';
          vehicleMarker = new maplibregl.Marker(vEl).setLngLat(start).addTo(map);

          journeyStartTime = Date.now();
          setInterval(syncTelemetry, 1000);

        } catch (err) {
          console.error("OSRM Route error:", err);
        }
      });
    }

    // Trigger Congestion Mode
    function triggerMode(idx) {
      currentProfileIdx = idx;
      simPhase = "GREEN";
      simTimer = trafficProfiles[idx].greenSecs;

      // Update button highlights
      document.querySelectorAll('.btn-demo').forEach(btn => btn.classList.remove('active'));
      const activeBtnId = ['btn-light', 'btn-moderate', 'btn-heavy', 'btn-emergency'][idx];
      document.getElementById(activeBtnId).classList.add('active');

      // Update UI immediately
      const activeProfile = trafficProfiles[currentProfileIdx];
      updateSignalUI(simPhase, simTimer, activeProfile.text, activeProfile.counts);
    }

    function moveToNextSignal() {
      if (routeCoords.length === 0) return;

      currentStep = Math.min(currentStep + Math.floor(routeCoords.length / 3), routeCoords.length - 1);
      const nextPos = routeCoords[currentStep];

      vehicleMarker.setLngLat(nextPos);
      map.flyTo({ center: nextPos, zoom: 14 });

      document.getElementById('step-info').innerText = `Junction ${Math.min(Math.floor(currentStep / (routeCoords.length/3)) + 1, 3)} of 3`;

      if (currentStep >= routeCoords.length - 1) {
        const actualTimeMins = Math.max(1, Math.round((Date.now() - journeyStartTime) / 60000));
        showArrivalReport(actualTimeMins);
      }
    }

    function showArrivalReport(actualTimeMins) {
      const diff = actualTimeMins - predictedEtaMins;
      let reasonText = "";

      if (Math.abs(diff) <= 2) {
        reasonText = `🎯 **Perfect Arrival!** Your journey took **${actualTimeMins} mins**, exactly matching the predicted optimal ETA.`;
      } else {
        reasonText = `⏱️ **Journey Completed:** Travel time took **${actualTimeMins} mins** (Predicted: ${predictedEtaMins} mins).\n\n**Adaptive Factors:** High volume of heavy vehicles created moderate PCU queue delays at intermediate intersections.`;
      }

      document.getElementById('report-text').innerText = reasonText;
      document.getElementById('arrival-modal').style.display = 'flex';
    }

    async function syncTelemetry() {
      try {
        const response = await fetch(BACKEND_URL);
        if (response.ok) {
          const data = await response.json();
          updateSignalUI(data.signal_state, data.signal_timer, data.route_status, data.vehicle_counts);
          return;
        }
      } catch (err) {}

      // Fallback local simulation logic
      simTimer--;
      if (simTimer <= 0) {
        if (simPhase === "GREEN") { 
          simPhase = "YELLOW"; 
          simTimer = 5; 
        } else if (simPhase === "YELLOW") { 
          simPhase = "RED"; 
          simTimer = 15; 
        } else { 
          simPhase = "GREEN"; 
          currentProfileIdx = (currentProfileIdx + 1) % trafficProfiles.length;
          simTimer = trafficProfiles[currentProfileIdx].greenSecs; 

          document.querySelectorAll('.btn-demo').forEach(btn => btn.classList.remove('active'));
          const activeBtnId = ['btn-light', 'btn-moderate', 'btn-heavy', 'btn-emergency'][currentProfileIdx];
          document.getElementById(activeBtnId).classList.add('active');
        }
      }

      const activeProfile = trafficProfiles[currentProfileIdx];
      updateSignalUI(
        simPhase, 
        simTimer, 
        activeProfile.text, 
        activeProfile.counts
      );
    }

    function updateSignalUI(state, timer, statusText, vc) {
      document.getElementById('light-red').classList.remove('active-light');
      document.getElementById('light-yellow').classList.remove('active-light');
      document.getElementById('light-green').classList.remove('active-light');

      if (state === "RED") document.getElementById('light-red').classList.add('active-light');
      else if (state === "YELLOW") document.getElementById('light-yellow').classList.add('active-light');
      else document.getElementById('light-green').classList.add('active-light');

      document.getElementById('signal-status').innerText = `${timer}s ${state}`;
      document.getElementById('route-status').innerText = statusText;

      const counts = vc || {};
      document.getElementById('cnt-2w').innerText = counts.motorcycle || 0;
      document.getElementById('cnt-4w').innerText = counts.car || 0;
      document.getElementById('cnt-auto').innerText = counts.autorickshaw || 0;
      document.getElementById('cnt-heavy').innerText = (counts.bus || 0) + (counts.truck || 0);
    }
  </script>
</body>
</html>
